# 2 GB rather than the 1 GB default: Kotlin + Compose compilation exhausts the default heap on a
# clean build, and the failure surfaces as an unrelated-looking daemon crash.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache. Both AGP 8.7 and Kotlin 2.1 support it; if a future plugin misbehaves this is
# the first switch to try, but it cuts configuration time substantially.
org.gradle.configuration-cache=true

# Mandatory for Compose; the old support library is long gone.
android.useAndroidX=true

# One R class per module rather than a transitive R containing every dependency's ids. Smaller, and
# it turns an accidental cross-module resource reference into a compile error.
android.nonTransitiveRClass=true

kotlin.code.style=official

# IDE sync only: lets Android Studio resolve the Gradle model in parallel. Studio writes this line
# itself on first open and rewrites it every time it is reverted, so it is committed rather than
# fought. The Tooling API is its only consumer — CI invokes gradlew directly and never reads it.
org.gradle.tooling.parallel=true
