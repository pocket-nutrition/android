# SPDX-License-Identifier: MPL-2.0
name: Release

# Cuts a stable, signed release of main, on demand (Actions → Release → Run workflow).
#
#   1. computes the next CalVer version vYYYY.M.N from the existing tags;
#   2. commits it to version.properties (plus the F-Droid changelog) as "chore(release): vX";
#   3. builds and signs the release APK from that commit and checks the signing certificate;
#   4. pushes the commit and the tag to main in one atomic push;
#   5. publishes the GitHub release with the APK, its .sha256 and the certificate fingerprint.
#
# Nothing is pushed unless the signed build succeeded, so a failed run leaves main and the tags untouched.
# The version lives in the tagged commit rather than in the tag name alone because F-Droid reads it from
# the repository at each tag; that is what lets it rebuild the tag, match our APK byte for byte, and ship
# the APK signed here — the same key as GitHub, IzzyOnDroid and Obtainium, so users can switch channels.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. Never cancel a running one: it may be between the push and the release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Kept in step with ci.yml and .ci/Dockerfile.
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  release:
    name: Signed release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Holds the signing secrets. Add required reviewers to it to make every release need an approval.
    environment: release
    permissions:
      contents: read
      checks: read # to require a green ci-success on the commit being released
    steps:
      # main is protected; the GitHub App is the one actor allowed to push the release commit to it.
      # Its token also makes that push trigger ci.yml, which skips the nightly for release commits.
      - name: Mint a token for the release app
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # calver-next.sh and the changelog need the tags and the history
          token: ${{ steps.app.outputs.token }}

      # main is normally reached through a pull request that passed CI, but an admin can push to it
      # directly, and CI may still be running. Never sign a commit whose gates have not passed.
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=ci-success" \
            --jq '.check_runs | sort_by(.started_at) | last | .conclusion // "missing"')"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::ci-success on ${sha} is '${conclusion}': wait for CI to pass on main, then re-run"
            exit 1
          fi

      - uses: ./.github/actions/setup-android

      - name: Compute the next version
        id: version
        run: |
          read -r version code < <(.github/scripts/calver-next.sh)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "next release: v${version} (versionCode ${code})"

      - name: Create the release commit and tag (local only)
        id: commit
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i -E "s/^versionName=.*/versionName=${VERSION}/; s/^versionCode=.*/versionCode=${CODE}/" version.properties
          grep -qx "versionName=${VERSION}" version.properties
          grep -qx "versionCode=${CODE}" version.properties

          # F-Droid shows fastlane changelogs/<versionCode>.txt on the app page; it caps them at 500 bytes.
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
          changelog="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          mkdir -p "$(dirname "${changelog}")"
          git log --no-merges --format='- %s' ${previous:+"${previous}..HEAD"} \
            | grep -v -e '^- chore(release):' -e '^- chore(deps' \
            | head -c 500 > "${changelog}" || true
          [ -s "${changelog}" ] || echo "- Maintenance release" > "${changelog}"

          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add version.properties "${changelog}"
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"

      - name: Write the signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The release build silently falls back to unsigned without these; a release must not.
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret for ${name} is missing from the release environment"
              exit 1
            fi
          done
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > key.properties

      - name: Test and build the signed APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify the signature and the certificate
        id: verify
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          src="app/build/outputs/apk/release/app-release.apk"
          [ -f "${src}" ] || { echo "::error::no signed APK at ${src}"; ls app/build/outputs/apk/release/; exit 1; }
          "${apksigner}" verify --verbose --print-certs "${src}" | tee apksigner.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)"
          [ -n "${actual}" ] || { echo "::error::could not read the certificate digest"; exit 1; }

          # Guards against signing with the wrong keystore: such an APK could never update existing installs.
          expected="$(echo "${EXPECTED_CERT_SHA256}" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          if [ -z "${expected}" ]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set; the certificate (${actual}) was not checked"
          elif [ "${actual}" != "${expected}" ]; then
            echo "::error::APK signed with ${actual}, expected ${expected}"
            exit 1
          fi

          apk="pocket-nutrition-android-${VERSION}.apk"
          cp "${src}" "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"
          echo "cert=$(echo "${actual}" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')" >> "${GITHUB_OUTPUT}"

      - name: Remove the signing material
        if: always()
        run: rm -f key.properties "${RUNNER_TEMP}/release.jks"

      # Kept so the release can be finished by hand if publishing fails after the push.
      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            ${{ steps.verify.outputs.apk }}
            ${{ steps.verify.outputs.apk }}.sha256
          retention-days: 30

      # Atomic: the commit and the tag land together or not at all. It fails, leaving everything as it was,
      # if main moved since the checkout or the tag already exists — re-run the workflow in that case.
      - name: Push the release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.verify.outputs.apk }}
          CERT: ${{ steps.verify.outputs.cert }}
          PREVIOUS: ${{ steps.commit.outputs.previous }}
        run: |
          # shellcheck disable=SC2016 # the backticks are a literal Markdown code fence
          notes="$(printf 'Signed APK. Signing certificate SHA-256:\n\n```\n%s\n```\n' "${CERT}")"
          gh release create "v${VERSION}" --verify-tag --latest --title "v${VERSION}" \
            --notes "${notes}" --generate-notes ${PREVIOUS:+--notes-start-tag "${PREVIOUS}"} \
            "${APK}" "${APK}.sha256"
