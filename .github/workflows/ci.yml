# SPDX-License-Identifier: MPL-2.0
name: CI

# Pull requests (including from forks) run the gates with a read-only token and no secrets.
# A push to main runs the same gates and then refreshes the rolling "nightly" pre-release (debug APK).
# Stable, signed releases are cut on demand by .github/workflows/release.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Kept in step with .ci/Dockerfile, which documents why each is pinned.
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  # 1. The contract this app was reviewed against is the contract it builds against.
  #    First because it takes seconds, and drift here invalidates everything after it.
  contracts:
    name: Contract pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: pocket-nutrition-android

      # Checked out beside this repo, which is the layout sync-contracts.sh expects by default.
      - name: Checkout pocket-nutrition/contracts
        uses: actions/checkout@v5
        with:
          repository: pocket-nutrition/contracts
          path: pocket-nutrition-contracts

      # Fails when the vendored contract/ differs from the pinned CONTRACTS_VERSION, or when the
      # contracts repo is not at that version.
      - name: Vendored contract matches the pinned version
        run: ./scripts/sync-contracts.sh --verify
        working-directory: pocket-nutrition-android

  # 2. Unit tests, including the shared behavioural corpus. Separate from the build so a behavioural
  #    failure is distinguishable at a glance from a compile failure.
  test:
    name: Unit tests
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 14

  # 3. Compile and lint. warningsAsErrors is on in both Kotlin and lint, so this is a real gate.
  build:
    name: Build and lint
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Lint
        run: ./gradlew lintDebug

      # Exercise R8 on every run, not only on release: R8 stripping a serializer that
      # kotlinx.serialization needs is a runtime crash, not a build error. No keystore here, so the
      # output is unsigned, which is fine: this step is about whether the code survives minification.
      - name: Bundle release (exercises R8; unsigned)
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  # The single required status check. Branch protection names this job and nothing else, so adding
  # or renaming a gate above never needs a settings change. Skipped needs are fine; failed or
  # cancelled ones are not.
  ci-success:
    name: ci-success
    if: always()
    needs: [contracts, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gate failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  # 4. Every commit on main refreshes one rolling pre-release, tagged `nightly`, holding the debug APK.
  #    It is a testing build: debug-signed, with the `.debug` application id, so it installs beside the
  #    stable app rather than over it. The `nightly` tag never matches `v*`, so F-Droid, IzzyOnDroid and
  #    Obtainium (which skips pre-releases by default) keep following the signed releases only.
  #    Release commits are skipped: the signed release of that same commit already exists.
  nightly:
    name: Nightly
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore(release):')
    needs: [contracts, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          apk="pocket-nutrition-android-nightly-${short}-debug.apk"
          cp app/build/outputs/apk/debug/*-debug.apk "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --prerelease --target "${GITHUB_SHA}" \
            --title "Nightly (${short})" \
            --notes "Debug build of ${GITHUB_SHA}, for testing. It installs beside the stable app (application id \`org.pocketnutrition.debug\`) and is signed with a throwaway debug key. Use the latest \`v*\` release for daily use." \
            "${apk}" "${apk}.sha256"
