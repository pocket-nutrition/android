# SPDX-License-Identifier: MPL-2.0
#
# Single place every version is declared. A version catalogue rather than inline strings so a bump is
# one line and two modules can never disagree about a dependency.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# Kotlin 2.x moved the Compose compiler into a Kotlin plugin, so it tracks the Kotlin version and
# must not be bumped independently of it.
composeBom = "2026.09.00"
kotlinxSerialization = "1.12.0"
# Already on the classpath through CameraX; declared because the meal photo reader uses it directly.
exifinterface = "1.4.2"
androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
junit = "4.13.2"
# Coil 3 for the Open Food Facts product photos in the suggestion list. Chosen over Glide because it
# is Compose-native and Kotlin-only — a single AsyncImage composable rather than a view-based loader
# wrapped in an interop layer — and it is the smallest of the three by a wide margin, which matters
# for an app whose only other runtime dependencies are Compose and kotlinx.serialization.
coil = "3.6.3"
# Live barcode scanning: CameraX supplies the preview + frame pipeline, ZXing the on-device decoder.
# ZXing (Apache-2.0, pure Java) replaced ML Kit, which is closed source and so cannot ship on F-Droid.
# Chosen over the Play-Services "Google Code Scanner" (com.google.android.gms:play-services-code-scanner),
# which needs neither a CAMERA permission nor a manifest entry because it owns its own full-screen
# scanning UI in a separate activity — but for exactly that reason it does not let this app show its
# own pre-permission explainer or drive a "permanently denied -> open Settings" flow, which the
# feature explicitly requires this app to control.
cameraX = "1.4.2"
zxing = "3.5.4"
# libsodium for the end-to-end-encrypted vault (Argon2id, crypto_kdf, XChaCha20-Poly1305, sealed boxes,
# BLAKE2b): the same library iOS (swift-sodium), the web reader (libsodium.js) and the server's test
# vectors use, so every client derives and opens the same bytes. Approved by the maintainer as a new
# dependency (2026-11-06). Lazysodium is MPL-2.0, like this repo, and bundles libsodium (ISC) built for
# all four Android ABIs with 16 KB page alignment; it binds through JNA (Apache-2.0 / LGPL-2.1) rather
# than its own JNI, so no NDK toolchain is needed here. Open source end to end, so it can ship on
# F-Droid. Cost: about 1.7 MB of native code across ABIs (libsodium + JNA's dispatcher). The app only
# calls the raw `com.goterl.lazysodium.Sodium` natives, which are byte-identical in the Android and
# JVM flavours: lazysodium-java is test-only, because a JVM unit test cannot load the Android .so.
# JNA is pinned to the version lazysodium 5.2.0 declares, and taken as its @aar (the jar carries
# desktop dispatchers and would clash on Android).
lazysodium = "5.2.0"
jna = "5.19.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# The BOM aligns every Compose artefact, so the entries below carry no version of their own.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Decodes the vendored behavioural corpus in unit tests, and later the API responses.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Product photos in the search list. coil-network-okhttp supplies the HTTP fetcher; without it Coil
# resolves local URIs only and every remote image silently fails.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

lazysodium-android = { group = "com.goterl", name = "lazysodium-android", version.ref = "lazysodium" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# Test-only: the same binding for the JVM, with libsodium built for desktop hosts.
lazysodium-java = { group = "com.goterl", name = "lazysodium-java", version.ref = "lazysodium" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
